<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Road Rush is a simple, free arcade car racing game. Dodge traffic and beat your best score.">
<link rel="manifest" href="manifest.json">
<title>Road Rush — Car Racing</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f32;--yellow:#ffd43b;--cyan:#39d5ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#15324a,var(--bg) 70%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f8ff;min-height:100vh;display:flex;justify-content:center}
main{width:min(100%,480px);padding:14px 14px 22px}
header{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.brand{font-weight:900;letter-spacing:1.6px;font-size:20px}.brand span{color:var(--yellow)}
.pill{background:#173149;border:1px solid #34536b;border-radius:999px;padding:6px 10px;font-size:12px;color:#b9dff4}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:#102238;border:1px solid #29465e;border-radius:13px;padding:9px;text-align:center}
.stat small{display:block;color:#8eafc7;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.stat strong{font-size:20px}
.game-wrap{position:relative;border:2px solid #41627b;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #0008;background:#173b2c}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06101bd9;padding:22px;text-align:center}
.overlay.hidden{display:none}
.dialog{width:100%;background:#102238;border:1px solid #34536b;border-radius:18px;padding:22px 16px}
.dialog h1{margin:0 0 8px;font-size:28px}.dialog p{color:#bdd0df;line-height:1.45;font-size:14px}
button{border:0;border-radius:13px;background:var(--yellow);color:#18202a;font-weight:900;font-size:16px;padding:13px 18px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.controls button{background:#173149;color:#fff;border:1px solid #41627b;font-size:18px}
.controls button span{color:var(--cyan)}
.hint{text-align:center;color:#88a9bf;font-size:12px;margin:10px 0}
footer{text-align:center;color:#6f8ea5;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<main>
<header><div class="brand">ROAD <span>RUSH</span></div><div class="pill">ARCADE • FREE TO PLAY</div></header>
<div class="stats">
 <div class="stat"><small>Score</small><strong id="score">0</strong></div>
 <div class="stat"><small>Best</small><strong id="best">0</strong></div>
 <div class="stat"><small>Speed</small><strong id="speed">1x</strong></div>
</div>
<div class="game-wrap">
 <canvas id="game" width="360" height="600" aria-label="Car racing game"></canvas>
 <div class="overlay" id="overlay"><div class="dialog">
  <h1 id="headline">Ready to race?</h1>
  <p id="message">Dodge traffic, stay on the road, and beat your high score. Use the buttons or tap the left/right side of the road.</p>
  <button id="start">START RACING</button>
 </div></div>
</div>
<div class="controls">
 <button id="left">◀ <span>LEFT</span></button>
 <button id="right"><span>RIGHT</span> ▶</button>
</div>
<p class="hint">Tip: short taps help you change lanes quickly.</p>
<footer>Road Rush • Original mini-game demo • v1.0</footer>
</main>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=360,H=600, roadL=42, roadR=318;
let player,traffic,score,best,playing,gameOver,lastSpawn,roadOffset,lastTime;
best=Number(localStorage.getItem('roadrush-best')||0);
$('best').textContent=best;
const colors=['#ff4f64','#ffb52e','#a78bfa','#e8f1f8'];
function reset(){
 player={x:159,y:475,w:42,h:72};
 traffic=[];score=0;playing=true;gameOver=false;lastSpawn=0;roadOffset=0;lastTime=0;
 $('overlay').classList.add('hidden');$('score').textContent='0';$('speed').textContent='1x';
}
function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function drawCar(x,y,color,isPlayer=false){
 // wheels
 rounded(x-4,y+12,7,18,3,'#090f17');rounded(x+39,y+12,7,18,3,'#090f17');
 rounded(x-4,y+44,7,18,3,'#090f17');rounded(x+39,y+44,7,18,3,'#090f17');
 rounded(x,y,42,72,9,color);
 rounded(x+6,y+10,30,20,5,isPlayer?'#a9f1ff':'#c9e8f6');
 ctx.fillStyle='#243b4e';ctx.fillRect(x+8,y+29,26,3);
 rounded(x+7,y+43,28,13,4,isPlayer?'#147ba4':'#45596b');
 ctx.fillStyle='#fff0a6';ctx.fillRect(x+5,y+3,8,4);ctx.fillRect(x+29,y+3,8,4);
 ctx.fillStyle='#ff5a5a';ctx.fillRect(x+5,y+64,8,4);ctx.fillRect(x+29,y+64,8,4);
}
function background(dt){
 ctx.fillStyle='#17613e';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#303c4a';ctx.fillRect(roadL,0,roadR-roadL,H);
 ctx.fillStyle='#e8edf4';ctx.fillRect(roadL-4,0,4,H);ctx.fillRect(roadR,0,4,H);
 ctx.fillStyle='#ffd34e';
 for(let y=-60+(roadOffset%90);y<H;y+=90){ctx.fillRect(129,y,5,48);ctx.fillRect(226,y,5,48);}
 ctx.fillStyle='#ffffff22';
 for(let y=-30+(roadOffset%65);y<H;y+=65){ctx.fillRect(12,y,17,3);ctx.fillRect(331,y,17,3);}
 if(playing)roadOffset=(roadOffset+dt*.20)%90;
}
function collide(a,b){return a.x+6<b.x+b.w-6&&a.x+a.w-6>b.x+6&&a.y+8<b.y+b.h-8&&a.y+a.h-8>b.y+8}
function spawn(){
 const lanes=[58,108,208,258];
 const lane=lanes[Math.floor(Math.random()*lanes.length)];
 traffic.push({x:lane,y:-85,w:42,h:72,color:colors[Math.floor(Math.random()*colors.length)]});
}
function endGame(){
 playing=false;gameOver=true;
 best=Math.max(best,Math.floor(score));localStorage.setItem('roadrush-best',best);
 $('best').textContent=best;
 $('headline').textContent='Race over!';
 $('message').textContent='Your score: '+Math.floor(score)+'. Try again and beat your best score!';
 $('start').textContent='RACE AGAIN';$('overlay').classList.remove('hidden');
}
function draw(time=0){
 const dt=Math.min(40,time-(lastTime||time));lastTime=time;
 background(dt);
 if(playing){
  score+=dt*.012;
  const speed=3.2+Math.min(score*.018,4.8);
  $('score').textContent=Math.floor(score);$('speed').textContent=(speed/3.2).toFixed(1)+'x';
  if(time-lastSpawn>Math.max(420,900-score*3)){spawn();lastSpawn=time;}
  for(const t of traffic)t.y+=speed*dt*.06;
  traffic=traffic.filter(t=>t.y<H+90);
  for(const t of traffic){if(collide(player,t)){endGame();break;}}
 }
 traffic.forEach(t=>drawCar(t.x,t.y,t.color));
 drawCar(player.x,player.y,'#27c7f5',true);
 requestAnimationFrame(draw);
}
function move(dir){if(!playing)return;player.x=Math.max(roadL+5,Math.min(roadR-player.w-5,player.x+dir*31));}
$('left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
$('right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
canvas.addEventListener('pointerdown',e=>{
 if(!playing)return;
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
 move(x<W/2?-1:1);
});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '&&!playing)reset();});
$('start').addEventListener('click',reset);
reset();playing=false;$('overlay').classList.remove('hidden');requestAnimationFrame(draw);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
